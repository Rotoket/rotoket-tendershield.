version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: tender_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tender}
      POSTGRES_USER: ${POSTGRES_USER:-tender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: tender_chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tender_backend
    env_file:
      - ../backend/.env
    environment:
      # Эти значения можно переопределить в backend/.env при необходимости
      TENDER_API_HOST: ${TENDER_API_HOST:-0.0.0.0}
      TENDER_API_PORT: ${TENDER_API_PORT:-8000}

      # Подключение к PostgreSQL через TENDER_DB_* (используются в config/database.py)
      TENDER_DB_USER: ${POSTGRES_USER:-tender_user}
      TENDER_DB_PASSWORD: ${POSTGRES_PASSWORD:-tender_password}
      TENDER_DB_HOST: db
      TENDER_DB_PORT: 5432
      TENDER_DB_NAME: ${POSTGRES_DB:-tender}

      # Подключение к Ollama (запускается на хосте, пробрасываем порт 11434)
      TENDER_OLLAMA_BASE_URL: ${TENDER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TENDER_OLLAMA_MODEL: ${TENDER_OLLAMA_MODEL:-qwen2.5-coder:7b}

    depends_on:
      - db
      - chromadb
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tender_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:


